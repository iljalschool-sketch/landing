<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유튜브 실습 자료실 | 일잘러스쿨</title>
    <meta name="description" content="일잘러스쿨 유튜브 강의의 카테고리별 실습 자료를 내려받을 수 있습니다.">
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; word-break: keep-all; }
        .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="hero-gradient text-white">
        <div class="max-w-5xl mx-auto px-6 py-16 md:py-24">
            <a href="../#career" class="inline-flex items-center text-sm font-semibold text-blue-100 hover:text-white transition mb-10">
                <i class="fas fa-arrow-left mr-2"></i>로직 플로우 홈페이지
            </a>
            <div class="flex items-center gap-3 text-red-300 font-bold mb-4">
                <i class="fab fa-youtube text-2xl"></i>
                <span>일잘러스쿨</span>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-5">유튜브 실습 자료실</h1>
            <p class="text-blue-100 text-lg leading-relaxed max-w-2xl">영상에서 사용한 예제 파일과 실습 자료를 카테고리별로 내려받으세요.</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-14 md:py-20">
        <nav aria-label="자료 카테고리" class="mb-12">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">카테고리</p>
            <a href="#vba" class="inline-flex items-center px-5 py-2.5 bg-blue-600 text-white rounded-full text-sm font-bold hover:bg-blue-700 transition shadow-sm">
                <i class="fas fa-code mr-2"></i>AI와 함께하는 VBA
            </a>
        </nav>

        <section id="vba" class="scroll-mt-8">
            <div class="flex items-end justify-between gap-4 mb-6">
                <div>
                    <p class="text-sm font-bold text-blue-600 mb-2">AI와 함께하는 VBA</p>
                    <h2 class="text-2xl md:text-3xl font-extrabold">엑셀 VBA 자동화 실습 자료</h2>
                </div>
                <span class="hidden sm:inline-flex px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold">1개 자료</span>
            </div>

            <a href="https://drive.google.com/uc?export=download&id=112v8cFcBYEI1I7T92iEFkP8guykQxfvL" target="_blank" rel="noopener noreferrer" class="group flex flex-col sm:flex-row sm:items-center justify-between gap-5 bg-white rounded-2xl border border-slate-200 p-6 md:p-7 shadow-sm hover:shadow-md hover:border-blue-300 transition">
                <div class="flex items-start gap-4">
                    <div class="w-12 h-12 shrink-0 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl">
                        <i class="fas fa-file-zipper"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 mb-2">실습 자료 · ZIP</p>
                        <h3 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition">엑셀 VBA 애드인 만들기 | 10분이면 언제든지 쓰는 '나만의 도구'</h3>
                    </div>
                </div>
                <span class="inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold group-hover:bg-blue-700 transition shrink-0">
                    다운로드 <i class="fas fa-download ml-2"></i>
                </span>
            </a>

            <p class="mt-5 text-sm text-slate-500 leading-relaxed">
                <i class="fas fa-circle-info mr-2 text-slate-400"></i>파일 용량이나 Google Drive 보안 확인에 따라 다운로드 확인 화면이 먼저 표시될 수 있습니다.
            </p>
        </section>
    </main>

    <footer class="border-t border-slate-200 bg-white">
        <div class="max-w-5xl mx-auto px-6 py-8 text-sm text-slate-500 flex flex-col sm:flex-row gap-3 justify-between">
            <p>© 2026 Logic Flow · 일잘러스쿨</p>
            <a href="https://www.youtube.com/@iljal-school" target="_blank" rel="noopener noreferrer" class="font-bold text-red-600 hover:text-red-700">
                <i class="fab fa-youtube mr-2"></i>YouTube 채널
            </a>
        </div>
    </footer>
</body>
</html>
