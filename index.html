<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===================================================================
         아래 메타태그와 히어로 문구는 검색엔진(구글·네이버·다음) 노출을 위해
         일부러 HTML에 직접 적어둔 것입니다. JSON으로 빼면 크롤러가 못 읽습니다.

         ★ 직접 고치지 마세요. data/brand.json 을 고친 뒤
           python tools/build_meta.py 를 실행하면 여기에 자동으로 써집니다.
         =================================================================== -->
    <!-- brand:seo:start -->
    <title>로직플로우 (LogicFlow) | AI 업무자동화 교육 · 컨설팅 · 솔루션 개발</title>
    <meta name="description" content="반복 업무를 줄이는 AI 업무자동화 교육 전문. 기업·공공기관 대상 파이썬, 엑셀, 챗GPT 활용 교육과 업무 자동화 솔루션 개발을 제공합니다.">
    <meta name="keywords" content="AI 업무자동화 교육, 파이썬 업무자동화, 챗GPT 활용 교육, 엑셀 자동화 교육, 기업교육, 공공기관 교육, 업무 효율화, 사무자동화, 강혜진, 프밍쌤, 로직플로우">
    <meta name="author" content="LogicFlow">
    <link rel="canonical" href="https://logicflow.ai.kr/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="로직플로우">
    <meta property="og:title" content="로직플로우 — 일하는 방식을 바꾸고, 성과를 만드는 기업">
    <meta property="og:description" content="배우는 데서 끝나지 않고, 일하는 방식이 달라지도록. AI 업무자동화 교육·컨설팅·솔루션 개발.">
    <meta property="og:url" content="https://logicflow.ai.kr/">
    <meta property="og:image" content="https://logicflow.ai.kr/images/brand/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <!-- brand:seo:end -->

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="180x180" href="/images/brand/favicon-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/favicon-180.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 브랜드 컬러를 Tailwind 클래스(bg-brand, text-accent 등)로 쓸 수 있게 등록한다.
        // 실제 색상값의 출처는 assets/brand.css 입니다. 바꿀 때 양쪽을 함께 수정하세요.
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand:  '#0B4D3B',   // 브랜드 그린 (메인)
                        growth: '#166B52',   // 그로스 그린 (보조)
                        accent: '#3DA37A',   // 라이트 그린 (포인트)
                        mint:   '#E8F4EE',   // 민트 그린 (배경)
                        deep:   '#073024',   // 딥 그린 (가장 어두운 톤)
                        point:  '#F9F871'    // 옐로우 (강조 — 친절함·주목)
                    }
                }
            }
        };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="assets/brand.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- ───────── 헤더 ───────── -->
    <header class="fixed w-full top-0 bg-white/90 backdrop-blur-md z-50 border-b border-slate-100">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center">
                <img src="images/brand/logo-horizontal-green.png" alt="Logic Flow"
                     class="h-7 md:h-9 w-auto object-contain">
            </a>

            <nav class="hidden md:flex space-x-6 text-sm font-semibold text-slate-600">
                <a href="#problems" class="hover:text-brand transition">해결하는 문제</a>
                <a href="#solutions" class="hover:text-brand transition">교육 · 솔루션</a>
                <a href="#about" class="hover:text-brand transition">강사 소개</a>
                <a href="#gallery" class="hover:text-brand transition">강의 현장</a>
                <a href="#career" class="hover:text-brand transition">경력사항</a>
                <a href="#contact" class="hover:text-brand transition">교육 문의</a>
            </nav>
        </div>
    </header>

    <!-- ───────── 히어로 (SEO를 위해 정적 유지) ───────── -->
    <section class="pt-32 pb-24 px-6 logic-gradient text-white">
        <div class="max-w-4xl mx-auto text-center">
            <!-- brand:hero:start -->
            <p class="text-point font-bold mb-5 tracking-wide text-xl md:text-2xl">기술보다 문제에 집중합니다</p>
            <h1 class="text-4xl md:text-6xl font-extrabold mb-8 leading-tight">
                배우는 데서 끝나지 않고, <br>
                <span class="text-point">일하는 방식이 달라지도록</span>
            </h1>
            <p class="text-lg text-mint mb-12 opacity-90 max-w-2xl mx-auto leading-relaxed">
                로직플로우는 AI와 자동화 기술을 활용한 교육, 컨설팅, 솔루션 개발을 통해 <br class="hidden md:block">
                개인과 조직의 업무 혁신을 돕는 기업입니다.
            </p>
            <!-- brand:hero:end -->
            <div class="flex flex-wrap justify-center gap-4">
                <a href="https://open.kakao.com/o/sEbFz6Se" target="_blank" rel="noopener"
                   class="bg-point text-brand px-8 py-3 rounded-full font-bold hover:brightness-95 transition shadow-lg flex items-center">
                    <i class="fas fa-comment mr-2"></i>교육 문의하기
                </a>
                <a href="https://www.youtube.com/@iljal-school" target="_blank" rel="noopener"
                   class="bg-white/10 backdrop-blur-md text-white border border-white/20 px-8 py-3 rounded-full font-bold hover:bg-white/20 transition">
                    <i class="fab fa-youtube mr-2"></i>일잘러스쿨
                </a>
            </div>
        </div>
    </section>

    <!-- ───────── 누적 성과 지표 → data/stats.json ───────── -->
    <section id="stats" class="py-16 px-6 bg-white border-b border-slate-100">
        <div class="max-w-5xl mx-auto">
            <div class="text-center mb-12">
                <h2 id="stats-heading" class="text-2xl font-bold text-slate-900 mb-2"></h2>
                <p id="stats-sub" class="text-slate-500 text-sm font-medium"></p>
            </div>
            <div id="stats-grid" class="grid grid-cols-2 md:grid-cols-4 gap-8"></div>
        </div>
    </section>

    <!-- ───────── 해결하는 문제 → data/problems.json ───────── -->
    <section id="problems" class="py-24 px-6 bg-mint">
        <div class="max-w-5xl mx-auto">
            <div class="text-center mb-14">
                <h2 id="problems-heading" class="text-3xl font-bold text-slate-900 mb-4 tracking-tight"></h2>
                <p id="problems-sub" class="text-slate-600 font-medium"></p>
                <div class="w-16 h-1 bg-brand mx-auto mt-6"></div>
            </div>
            <div id="problems-grid" class="grid md:grid-cols-2 gap-5"></div>
            <p id="problems-note" class="text-center text-sm text-slate-500 mt-10"></p>
        </div>
    </section>

    <!-- ───────── 소개 영상 → data/site.json ───────── -->
    <section id="intro-video" class="py-20 px-6 bg-white">
        <div id="intro-video-body" class="max-w-4xl mx-auto"></div>
    </section>

    <!-- ───────── 교육 · 솔루션 → data/courses.json ───────── -->
    <section id="solutions" class="py-24 px-6 max-w-6xl mx-auto">
        <div class="text-center mb-16">
            <h2 id="solutions-heading" class="text-3xl font-bold text-slate-900 mb-4 tracking-tight"></h2>
            <p id="solutions-sub" class="text-slate-500 font-medium"></p>
            <div class="w-16 h-1 bg-brand mx-auto mt-6"></div>
        </div>
        <div id="solutions-grid" class="grid md:grid-cols-2 gap-8"></div>
    </section>

    <!-- ───────── 강사 소개 → data/site.json ───────── -->
    <section id="about" class="bg-deep py-24 px-6 text-white">
        <div id="about-body" class="max-w-4xl mx-auto flex flex-col md:flex-row items-center gap-16"></div>
    </section>

    <!-- ───────── 강의 현장 갤러리 → data/gallery.json ───────── -->
    <section id="gallery" class="py-24 px-6 bg-mint">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-14">
                <h2 id="gallery-heading" class="text-3xl font-bold text-slate-900 mb-4 tracking-tight"></h2>
                <p id="gallery-sub" class="text-slate-500 font-medium"></p>
                <div class="w-16 h-1 bg-brand mx-auto mt-6"></div>
            </div>
            <!-- '이런 활동을 했다' 정도만 보여주면 되므로 작게 여러 장 늘어놓는다 -->
            <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
        </div>
    </section>

    <!-- ───────── 경력사항 → data/education·lectures·automation·videos.json ───────── -->
    <section id="career" class="bg-deep py-24 px-6 text-white">
        <div class="max-w-5xl mx-auto">
            <div class="text-center mb-16">
                <h2 class="text-3xl font-bold mb-4 tracking-tight">Career &amp; Portfolio</h2>
                <p class="text-slate-400 font-medium">기능이 아닌, 시간과 성장을 제공합니다</p>
                <div class="w-16 h-1 bg-accent mx-auto mt-6"></div>
            </div>

            <div class="flex flex-wrap justify-center gap-3 mb-12">
                <button class="tab-btn active" data-tab="education"><i class="fas fa-graduation-cap mr-2"></i>학력</button>
                <button class="tab-btn" data-tab="lectures"><i class="fas fa-chalkboard-teacher mr-2"></i>강의</button>
                <button class="tab-btn" data-tab="automation"><i class="fas fa-cogs mr-2"></i>자동화 개발</button>
                <button class="tab-btn" data-tab="youtube"><i class="fab fa-youtube mr-2"></i>일잘러스쿨</button>
            </div>

            <div id="tab-education"  class="tab-content active"></div>
            <div id="tab-lectures"   class="tab-content"></div>
            <div id="tab-automation" class="tab-content"></div>
            <div id="tab-youtube"    class="tab-content"></div>
        </div>
    </section>

    <!-- ───────── 문의하기 → data/site.json ───────── -->
    <footer id="contact" class="bg-white py-24 px-6 border-t border-slate-100 text-center">
        <div class="max-w-4xl mx-auto">
            <h2 id="contact-heading" class="text-3xl font-bold mb-12 text-slate-900"></h2>
            <div id="contact-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-16"></div>
            <img src="images/brand/symbol-green.png" alt="" class="h-10 w-auto mx-auto mb-6 opacity-40">
            <p id="contact-copyright" class="text-slate-400 text-sm font-medium"></p>
        </div>
    </footer>

    <!-- ───────── 사진 확대 보기 ───────── -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="사진 확대 보기">
        <button data-prev class="absolute left-4 md:left-10 text-white/70 hover:text-white text-3xl p-4" aria-label="이전 사진">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="text-center">
            <!-- src는 사진을 열 때 채운다. 빈 src는 현재 페이지를 다시 요청하므로 두지 않는다 -->
            <img id="lightbox-img" alt="">
            <p id="lightbox-caption" class="text-white/80 text-sm mt-4 font-medium"></p>
        </div>
        <button data-next class="absolute right-4 md:right-10 text-white/70 hover:text-white text-3xl p-4" aria-label="다음 사진">
            <i class="fas fa-chevron-right"></i>
        </button>
        <button class="absolute top-6 right-6 text-white/70 hover:text-white text-2xl p-2" aria-label="닫기">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script src="assets/render.js"></script>
</body>
</html>
